name: Tests du backend
on:
  push:
    branches: [main, partieHamza]
    paths: ['backend/**', 'data/catalog/**', 'data/recipes/**', 'requirements.txt', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'data/catalog/**', 'data/recipes/**', 'requirements.txt', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: optimeal_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d optimeal_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OPTIMEAL_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/optimeal_test_ci
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest backend/tests -q
